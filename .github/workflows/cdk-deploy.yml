name: Deploy AWS Infrastructure using CDK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v2

    - name: Set up Python environment
      run: |
        python -m venv .venv  # Crear entorno virtual
        source .venv/bin/activate  # Activar entorno virtual
        pip install --upgrade pip  # Asegurarse de tener la última versión de pip
        pip install -r requirements.txt  # Instalar dependencias

    - name: Install AWS CDK
      run: |
        npm install -g aws-cdk  # Instalar CDK globalmente

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy infrastructure using CDK
      run: |
        source .venv/bin/activate  # Activar entorno virtual
        cdk deploy --require-approval never  # Desplegar la infraestructura en AWS